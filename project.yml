# XcodeGen spec. The CI generates BahnMap.xcodeproj from this file (no Mac needed locally).
# Values like ${BUNDLE_ID} are filled from environment variables by the GitHub workflow.
name: BahnMap
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
targets:
  BahnMap:
    type: application
    platform: iOS
    sources:
      - path: BahnMap
        excludes:
          - "Info.plist"
    dependencies:
      - package: ZIPFoundation
    info:
      path: BahnMap/Info.plist
      properties:
        CFBundleDisplayName: BahnMap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.travel
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Your location is used to show where you are on the map and to find the nearest station.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        DEVELOPMENT_TEAM: "${TEAM_ID}"
        CODE_SIGN_STYLE: "${CODE_SIGN_STYLE}"
        CODE_SIGN_IDENTITY: "${CODE_SIGN_IDENTITY}"
        PROVISIONING_PROFILE_SPECIFIER: "${PROFILE_NAME}"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
schemes:
  BahnMap:
    build:
      targets:
        BahnMap: all
    archive:
      config: Release
