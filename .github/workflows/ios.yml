name: iOS build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign and upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.42.0"

jobs:
  # Compiles the app for the simulator on every push, so compile errors show up without signing.
  build:
    name: Build (simulator)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.example.bahnmap' }}
          TEAM_ID: ""
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: ""
          PROFILE_NAME: ""
          BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project BahnMap.xcodeproj -scheme BahnMap \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning: .*BahnMap/|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log

  # Signs (automatically, via the App Store Connect API key), archives and uploads to TestFlight.
  # Runs on pushes to main and on manual runs.
  testflight:
    name: Archive & TestFlight
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testflight || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'de.astaliyaa.bahnmap' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets (APPLE_TEAM_ID / ASC_*):$missing. See docs/SETUP.md."
            exit 1
          fi

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          # Accept the key either as the raw .p8 text or base64-encoded.
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          PROFILE_NAME: ""
          BUILD_NUMBER: ${{ github.run_number }}
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project BahnMap.xcodeproj -scheme BahnMap \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BahnMap.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Export IPA
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BahnMap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee export.log | tail -5
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "### Uploaded build ${{ github.run_number }} ($BUNDLE_ID) to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight once Apple has processed it (usually 5–15 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep IPA as artifact
        uses: actions/upload-artifact@v5
        with:
          name: BahnMap-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: archive-logs
          path: |
            archive.log
            export.log

      - name: Clean up
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
